[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaampilot"
version = "0.1.0"
description = "Human-in-the-loop quotation workflow for trade businesses"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "rapidfuzz>=3.9",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# One LLM provider is enough; KP_LLM_MODEL picks it (D-014).
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=4.0"]
anthropic = ["langchain-anthropic>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: calls a live LLM provider (opt-in: pytest -m llm)",
]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
